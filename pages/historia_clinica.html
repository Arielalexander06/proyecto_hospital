<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/imgs/edificio-del-hospital.png">
    <title>Historial Clinico</title>
</head>
<body>
    <nav>
        <a href="/index.html">Inicio</a> 
        <a href="/pages/historia_clinica.html">Historia Clinica</a>
    </nav>
    <hr>
    <h1 style="text-align: center;"> Historia Clinica</h1>
    <form action="#"></form>
    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha" required>

    <h3>Datos de Identificación</h3>
    <label for="nombre">Nombre completo:</label>
    <input type="text" placeholder="Nombre completo" id="nombre" required>
    <br><br>
    <label for="ci">Cedula identidad:</label>
    <input type="text" placeholder="Cedula de identidad" id="ci" required>
    <br><br>
    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
    <input type="date" id="fecha_de_nacimiento" required>
    <br><br>
    <label for="edad">Edad:</label>
    <input type="number" name="" id="edad" placeholder="edad" min="0" max="100">
    <br><br>
    <label for="genero">Género:</label>
    <label for="masculino"><input type="radio" id="masculino" name="genero">Masculino</label>
    <label for="femenino"><input type="radio" id="femenino" name="genero">Femenino</label>
    <label for="otro"><input type="radio" id="otro" name="genero">Otro</label>
    <br><br>
    <label for="ocupacion">Ocupación:</label>
    <input type="text" placeholder="ocupación" id="ocupacion">
    <br><br>
    <label for="residencia_actual">Residencia Actual:</label>
    <input type="text" placeholder="residencia actual" id="residencia_actual">
    <br><br>
    <label for="residencia_anterior">Residencia Anterior:</label>
    <input type="text" placeholder="residencia anterior" id="residencia_anterior">
    <br><br>
    <label for="contacto">Contacto:</label>
    <input type="tel" name="telefono" id="contacto" placeholder="+539-9999999">
    <br><br>
    <h3 for="consulta">Motivo de consulta</h3>
    <textarea name="motivo_de_consulta" id="consulta" rows="4" cols="100"></textarea>
    <br><br>
    <h3>Enfermedad Actual:</h3>
    <textarea name="enfermedad" id="enfermedad" rows="4" cols="100"></textarea>
    <br><br>
    <label for="examenes">Examenes Anteriores</label>
    <br><br>
    <input type="file">
    <br><br>
    <input type="button" value="Guardar">
    <input type="button" value="Reiniciar" type="reset">
</body>
</html>
