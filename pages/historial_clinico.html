<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../imgs/informe-medico.png">
    <title>Historia Clinica</title>
</head>
<body>
    <script>
        if (sessionStorage.getItem("accesoDoctor") !== "ok") {
            window.location.href = "./portal_clinico.html";
        }
    </script>

    <header>
        <nav>
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <figure style="text-align: center; margin: 0; width: 120px;">
                    <a href="./portal_clinico.html"><img src="../imgs/volver.png" alt="Volver" width="50"><figcaption>Volver</figcaption></a>
                </figure>
                <figure style="text-align: center; margin: 0; width: 120px;">
                    <a href="../index.html"><img src="../imgs/pagina-de-inicio.png" alt="Inicio" width="50"><br><figcaption>Inicio</figcaption></a>
                </figure>
            </div>
        </nav>
    </header>

    <hr>
    <form action="#">
        <fieldset>
            <legend><h3>Historia Clinica</h3></legend>
            <p>
                <label for="doctor">Doctor:</label>
                <input type="text" id="doctor" name="doctor" placeholder="Nombre del doctor">
            </p>
            <p>
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>
            </p>
            <p>
                <label for="hora_atencion">Hora de Atención:</label>
                <input type="time" id="hora_atencion" name="hora_atencion">
            </p>
            <p>
                <label for="turno">Turno</label>
                <input type="number" min="0" id="turno" name="turno">
            </p>
        </fieldset>

        <fieldset>
            <legend><h3>Datos del Paciente</h3></legend>
            <label for="nombre">Nombre completo:</label>
            <input type="text" placeholder="Nombre completo" id="nombre" name="nombre" required>
            <br><br>
            <label for="ci">Cedula identidad:</label>
            <input type="text" placeholder="Cedula de identidad" id="ci" name="ci" required>
            <br><br>
            <label for="fecha_nacimiento">Fecha de nacimiento:</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            <br><br>
            <label for="edad">Edad:</label>
            <input type="number" name="edad" id="edad" placeholder="edad" min="0" max="100">
            <br><br>
            <label>Género:</label>
            <label for="masculino"><input type="radio" id="masculino" name="genero" value="Masculino">Masculino</label>
            <label for="femenino"><input type="radio" id="femenino" name="genero" value="Femenino">Femenino</label>
            <label for="otro"><input type="radio" id="otro" name="genero" value="Otro">Otro</label>
            <br><br>
            <label for="ocupacion">Ocupación:</label>
            <input type="text" placeholder="ocupación" id="ocupacion" name="ocupacion">
            <br><br>
            <label for="residencia_actual">Residencia Actual:</label>
            <input type="text" placeholder="residencia actual" id="residencia_actual" name="residencia_actual">
            <br><br>
            <label for="residencia_anterior">Residencia Anterior:</label>
            <input type="text" placeholder="residencia anterior" id="residencia_anterior" name="residencia_anterior">
            <br><br>
            <label for="contacto">Contacto:</label>
            <input type="tel" name="telefono" id="contacto" placeholder="+539-9999999">
        </fieldset>

        <fieldset>
            <legend><h3>Motivo de Consulta</h3></legend>
            <textarea name="motivo_de_consulta" id="consulta" rows="4" cols="100" placeholder="Escriba el motivo de la consulta"></textarea>
        </fieldset>

        <fieldset>
            <legend><h3>Enfermedad Actual:</h3></legend>
            <textarea name="enfermedad" id="enfermedad" rows="4" cols="100" placeholder="Escriba la enfermedad actual"></textarea>
        </fieldset>

        <fieldset>
            <legend><h3>Examenes Actuales</h3></legend>
            <label for="examanes_actuales">Subir los examanes actuales hechos al paciente en formato PDF</label>
            <br><br>
            <input type="file" id="examanes_actuales" name="examanes_actuales" accept="application/pdf">
        </fieldset>

        <fieldset>
            <legend><h3>Tipo de sangre</h3></legend>
            <select name="tipo_sangre" id="tipo_sangre">
                <option value="seleccionar">Seleccionar</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>
        </fieldset>

        <fieldset>
            <legend><h3>Signos Vitales</h3></legend>
            <p>
                <label for="presion">Presión arterial:</label>
                <input type="text" id="presion" name="presion" placeholder="120/80">
            </p>
            <p>
                <label for="frecuencia">Frecuencia cardiaca:</label>
                <input type="number" id="frecuencia" name="frecuencia" min="30" max="250" placeholder="75">
            </p>
            <p>
                <label for="temperatura">Temperatura:</label>
                <input type="number" id="temperatura" name="temperatura" min="34" max="43" step="0.1" placeholder="36.5">
            </p>
        </fieldset>

        <br><br>
        <button type="submit">Guardar</button>
        <button type="reset">Reinicar</button>
    </form>
</body>
</html>
